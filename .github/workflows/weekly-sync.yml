name: Weekly API Sync

on:
  schedule:
    # Every Monday at 00:00 KST (Sunday 15:00 UTC)
    - cron: '0 15 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-apis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sync Script
        run: npx tsx scripts/sync-apis.ts

      - name: Verify Build
        run: npm run build
        env:
          # Skip strict type checks if needed, but here we want to ensure it works
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/apis.ts
          git commit -m "chore(data): weekly api list update [skip ci]"
          git push
